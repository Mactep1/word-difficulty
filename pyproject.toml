[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "word-difficulty"
version = "0.1.0"
description = "Local English book and subtitle vocabulary extraction with CEFR levels"
requires-python = ">=3.12,<3.14"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "charset-normalizer>=3.4,<4",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "openpyxl>=3.1,<4",
  "pypdf>=5,<7",
  "pysubs2>=1.8,<2",
  "python-docx>=1.1,<2",
  "spacy>=3.8,<3.9",
  "streamlit>=1.45,<2",
]

[project.optional-dependencies]
model = ["torch>=2.6,<3", "transformers>=4.53,<5", "sentencepiece>=0.2,<1", "protobuf>=5,<7"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
word-difficulty = "word_difficulty.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/word_difficulty"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: optional real model tests requiring installed dependencies and downloaded weights"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
